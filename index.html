const PumpViewport=(()=>{
  let art=null,canvas=null,context=null,host=null,frame=0,last=0,seconds=0,paused=false,assetStarted=false,mode='waiting',stageState={progress:[0,0,0,0,0],working:false},positions=[0,0,0,0,0],lastKey='',width=0,height=0;
  const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches||false;if(reduced)paused=true;
  function startAsset(){if(assetStarted)return;assetStarted=true;const image=document.createElement('img');image.onload=()=>{try{art=createPumpArtwork(image,(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;});mode='canvas';lastKey='';schedule();}catch(e){mode='fallback';}};image.onerror=()=>{mode='fallback';};image.src=PUMP_IMAGE;}
  function schedule(){if(frame)return;frame=requestAnimationFrame(tick);}
  function tick(now){frame=0;if(!canvas||!context||!art||!host?.isConnected)return;const dt=last?Math.min(.06,(now-last)/1000):0;last=now;let moving=false;
    for(let i=0;i<5;i++){const diff=stageState.progress[i]-positions[i];if(Math.abs(diff)>.0005){positions[i]+=diff*(1-Math.exp(-dt*7));moving=true;}else positions[i]=stageState.progress[i];}
    const operational=stageState.working&&positions.every(v=>v>.999),pumping=operational&&!paused;if(pumping)seconds+=dt;
    const dpr=Math.min(window.devicePixelRatio||1,2),w=Math.max(240,host.clientWidth||500),h=Math.max(220,host.clientHeight||350);
    if(w!==width||h!==height){width=w;height=h;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}
    context.setTransform(dpr,0,0,dpr,0,0);drawPump(context,art,w,h,positions,seconds,operational);
    host.classList.add('pump-ready');const status=host.querySelector('[data-pump-status]');if(status)status.textContent=operational?(pumping?'Насос работает · нефть поступает в трубопровод':'Сборка завершена · насос остановлен'):Math.round(stageState.progress.reduce((a,b)=>a+b,0)*20)+'% · сборка по задачам';
    if(moving||pumping)schedule();
  }
  function bind(state){const target=ROOT.querySelector('[data-pump-demo]')||ROOT.querySelector('[data-pump-header]');if(!target)return;startAsset();if(!canvas){canvas=document.createElement('canvas');canvas.setAttribute('role','img');canvas.setAttribute('aria-label','Присланный рисунок станка-качалки: сборка по задачам и согласованная работа механизма');try{context=canvas.getContext?.('2d');}catch{context=null;}}
