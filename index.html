function validState(x){return x?.version===1&&Array.isArray(x.tasks)&&Array.isArray(x.people)&&Array.isArray(x.projects)&&x.tasks.length<=500&&x.people.length<=100&&x.projects.length<=100&&x.people.every(p=>typeof p.id==='string'&&typeof p.name==='string'&&typeof p.role==='string')&&x.projects.every(p=>typeof p.id==='string'&&typeof p.name==='string'&&typeof p.goal==='string'&&typeof p.due==='string'&&x.people.some(u=>u.id===p.owner))&&x.tasks.every(t=>typeof t.id==='string'&&typeof t.title==='string'&&typeof t.code==='string'&&typeof t.description==='string'&&Object.hasOwn(STAGES,t.stage)&&['high','normal'].includes(t.priority)&&/^\d{4}-\d{2}-\d{2}$/.test(t.due)&&/^\d{4}-\d{2}-\d{2}$/.test(t.start)&&x.people.some(p=>p.id===t.owner)&&x.projects.some(p=>p.id===t.project)&&Array.isArray(t.checks)&&t.checks.every(c=>typeof c.text==='string'&&typeof c.done==='boolean')&&Array.isArray(t.comments)&&t.comments.every(c=>typeof c.text==='string'&&typeof c.at==='string')&&Array.isArray(t.depends)&&t.depends.every(id=>x.tasks.some(p=>p.id===id)));}
function person(id){return S.people.find(p=>p.id===id)||S.people[0]}function project(id){return S.projects.find(p=>p.id===id)}
function avatar(id){const p=person(id);return '<span class="avatar '+esc(id)+'" title="'+esc(p.name)+'">'+esc(p.name.split(' ').slice(0,2).map(n=>n[0]).join(''))+'</span>';}
function progress(t){return t.stage==='done'?100:t.checks.length?Math.round(t.checks.filter(c=>c.done).length/t.checks.length*100):0}
function aggregate(tasks){return {total:tasks.length,done:tasks.filter(t=>t.stage==='done').length,late:tasks.filter(isLate).length,review:tasks.filter(t=>t.stage==='review').length,progress:tasks.length?Math.round(tasks.reduce((n,t)=>n+progress(t),0)/tasks.length):0};}
function isLate(t){return t.stage!=='done'&&t.due<TODAY}
function fmt(date){return new Intl.DateTimeFormat('ru',{day:'numeric',month:'short',timeZone:'UTC'}).format(new Date(date+'T12:00:00Z')).replace('.','')}
function scoped(){return S.tasks.filter(t=>(!U.project||t.project===U.project)&&(!U.owner||t.owner===U.owner)&&(U.period==='all'||(t.due>='2026-11-02'&&t.due<=(U.period==='week'?'2026-11-08':'2026-11-20'))));}
function filtered(){return scoped().filter(t=>(!U.q||[t.title,t.code,t.description,person(t.owner).name,project(t.project)?.name].join(' ').toLowerCase().includes(U.q.toLowerCase()))&&(U.filter==='all'||U.filter==='late'&&isLate(t)||U.filter==='high'&&t.priority==='high'&&t.stage!=='done'||U.filter==='active'&&t.stage!=='done'||t.stage===U.filter)).sort((a,b)=>U.sort==='due'?a.due.localeCompare(b.due):U.sort==='progress'?progress(b)-progress(a):0);}
function badge(t){const s=STAGES[t.stage];return '<span class="badge '+s.color+'"><span class="dot"></span>'+s.name+'</span>'}
function save(){if(storageOn){try{localStorage.setItem(KEY,JSON.stringify(S));}catch{storageOn=false;toast('Сохранение недоступно. Выгрузите JSON-копию.');}}}
function change(fn,message){undoState=structuredClone(S);fn();save();render();if(message)toast(message,true);}
function toast(text,undo=false){clearTimeout(toastTimer);const el=document.getElementById('toast');el.innerHTML=esc(text)+(undo?'<button data-action="undo">Отменить</button>':'');el.classList.add('show');toastTimer=setTimeout(()=>el.classList.remove('show'),7000);}
function hydrate(root=document){root.querySelectorAll('[data-icon]').forEach(n=>n.innerHTML=icon(n.dataset.icon));}
function nav(){const items=[['overview','grid','Сводка',''],['tasks','tasks','Задачи',S.tasks.length],['projects','layers','Комплексные задачи',S.projects.length],['route','route','Маршрут и Гант',''],['team','team','Команда','']];document.getElementById('nav').innerHTML=items.map(([id,i,label,count])=>'<button data-nav="'+id+'" class="'+(U.page===id?'active':'')+'" '+(U.page===id?'aria-current="page"':'')+'>'+icon(i)+'<span>'+label+'</span>'+(count!==''?'<span class="nav-count">'+count+'</span>':'')+'</button>').join('');document.getElementById('breadcrumb').textContent=items.find(i=>i[0]===U.page)[2];document.getElementById('theme').innerHTML=icon(document.body.classList.contains('dark')?'sun':'moon')+'<span>'+(document.body.classList.contains('dark')?'Светлая тема':'Тёмная тема')+'</span>';}
function pageHeader(title,sub){return '<div class="between page-heading"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="page-actions"><button class="button" data-action="export">'+icon('download')+'Экспорт</button><button class="button primary" data-action="new">'+icon('plus')+'Новая задача</button></div></div>';}
function scopeControls(){return '<div class="flex" style="gap:8px;flex-wrap:wrap;margin-bottom:18px"><span class="tiny muted">Показать:</span><select id="project-filter" aria-label="Фильтр по проекту"><option value="">Все проекты</option>'+S.projects.map(p=>'<option value="'+esc(p.id)+'" '+(U.project===p.id?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select><select id="period-filter" aria-label="Период по сроку задачи">'+[['all','Все сроки'],['week','Эта неделя · 2–8 ноября'],['fortnight','До 20 ноября']].map(([v,l])=>'<option value="'+v+'" '+(U.period===v?'selected':'')+'>'+l+'</option>').join('')+'</select><span class="spacer"></span><span class="tiny muted">'+icon('calendar')+' 6 ноября 2026 · пятница</span></div>';}
function kpis(){const a=aggregate(scoped());const data=[['all','Всего задач',a.total,'tasks','В '+new Set(scoped().map(t=>t.project)).size+' комплексных проектах',''],['done','Завершено',a.done+' <small>/ '+a.total+'</small>','checkCircle',(a.total?Math.round(a.done/a.total*100):0)+'% задач закрыто','positive'],['late','Срок пропущен',a.late,'clock',a.late?'Требуют внимания руководителя':'Все активные задачи в срок','warning'],['review','На согласовании',a.review,'layers','Ожидают следующего решения','']];return '<div class="kpis">'+data.map(([f,title,value,i,note,c])=>'<button class="card kpi" data-kpi="'+f+'" aria-label="Показать: '+title+'"><div class="kpi-top"><span>'+title+'</span>'+icon(i)+'</div><div class="kpi-value mono">'+value+'</div><div class="kpi-bottom"><span class="'+c+'">'+(c==='positive'?'↗ ':'')+note+'</span></div></button>').join('')+'</div>';}
function pump(){return '<svg class="pump '+(U.pumpPaused?'paused':'')+'" viewBox="0 0 330 180" role="img" aria-label="Схематичный станок-качалка — визуальный символ общего результата"><defs><pattern id="pumpgrid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#80ad95" opacity=".16"/></pattern></defs><rect x="15" y="10" width="305" height="158" fill="url(#pumpgrid)"/><ellipse cx="179" cy="165" rx="129" ry="7" fill="#092e29" opacity=".5"/><g class="detail"><path d="M58 163h250M75 152v-13m-8 13v-13M170 69v88m-8-1h16"/><path d="M140 142h60m-53-19h46m-38-18h30"/></g><g class="structure"><path d="M128 157 170 69l41 88M143 157l27-57 25 57" stroke-width="4"/><path d="M118 158h103M224 158h61v-22h-61zM235 136v-14h39v14" stroke-width="4"/></g><g class="crank"><circle cx="250" cy="129" r="20" fill="#143d38" stroke="#53896e" stroke-width="3"/><path d="m250 129 13-13" stroke="#9dc9a8" stroke-width="6"/><circle cx="250" cy="129" r="4" fill="#9dc9a8"/></g><g class="beam"><path d="M64 57h209v12H64z" fill="#93c7a4"/><path d="M64 50c-17 0-28 10-28 28l17 10c0-12 4-20 13-21z" fill="#b6d9b4"/><path d="M168 64 261 119" stroke="#639d7c" stroke-width="5"/><circle cx="170" cy="69" r="7" fill="#143d38" stroke="#b7d8b5" stroke-width="3"/></g><g class="rod"><path d="M44 80v70" stroke="#b7d8b5" stroke-width="2"/><rect x="37" y="130" width="14" height="5" rx="1" fill="#6b9d80"/><path d="M44 149v19" stroke="#75b090" stroke-width="4"/></g><path d="M44 157h20v8h18" stroke="#68977a" fill="none" stroke-width="3"/></svg>';}
function hero(){const p=project(U.project)||project('conference')||S.projects[0],tasks=S.tasks.filter(t=>t.project===p.id),a=aggregate(tasks);return '<section class="card hero"><div><div class="eyebrow"><span class="dot"></span>В фокусе · комплексная задача</div><h2>'+esc(p.name)+'</h2><p class="hero-description">'+esc(p.goal)+'</p><div class="flex"><div class="avatar-group">'+[...new Set(tasks.map(t=>t.owner))].slice(0,5).map(avatar).join('')+'</div><span class="tiny" style="color:#adcabb">'+a.done+' из '+a.total+' задач готовы</span></div><button class="hero-link" data-open-project="'+esc(p.id)+'">Открыть проект '+icon('arrow')+'</button></div><div class="hero-progress"><span>Готовность</span><strong>'+a.progress+'%</strong></div><div class="pump-wrap">'+pump()+'<div class="pump-caption"><span class="dot"></span><span>Механизм общего результата</span><button data-action="pump" aria-label="'+(U.pumpPaused?'Запустить':'Приостановить')+' анимацию">'+icon(U.pumpPaused?'play':'pause')+'</button></div></div></section>';}
function pipeline(){const tasks=scoped();return '<section class="card pipeline"><div class="between"><h2>Задачи по этапам</h2><span class="tiny muted">'+tasks.length+' всего</span></div>'+Object.entries(STAGES).map(([id,s])=>{const count=tasks.filter(t=>t.stage===id).length;const color=id==='inbox'?'#a2b7c9':id==='work'?'#218d75':id==='review'?'#d7b77c':'#76b6a2';return '<button class="stage-row" data-kpi="'+id+'" aria-label="'+s.name+': '+count+'"><span class="dot" style="color:'+color+'"></span><span class="stage-name">'+s.name+'</span><span class="bar"><span style="width:'+(tasks.length?100*count/tasks.length:0)+'%;background:'+color+'"></span></span><span class="count">'+count+'</span></button>'}).join('')+'<div class="pipeline-footer">'+icon('info')+' Нажмите на этап, чтобы открыть задачи</div></section>';}
function chart(){const a=aggregate(scoped()),actual=[0,Math.min(8,a.progress),Math.min(16,a.progress),Math.min(24,a.progress),a.progress],plan=[0,15,30,45,60,80,100],xs=[32,126,220,314,408,502,596],y=v=>136-v*1.12;const line=arr=>arr.map((v,i)=>(i?'L':'M')+xs[i]+','+y(v)).join(' ');return '<section class="card"><div class="between card-head"><div><h2>Движение к результату</h2><p class="tiny muted" style="margin-top:4px">Готовность задач, %</p></div><div class="legend"><span><i></i>Факт</span><span><i class="plan"></i>План</span></div></div><div class="chart"><svg viewBox="0 0 620 158" preserveAspectRatio="none" role="img" aria-label="Учебный план и факт готовности: текущая готовность '+a.progress+' процентов"><defs><linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#239679" stop-opacity=".16"/><stop offset="100%" stop-color="#239679" stop-opacity="0"/></linearGradient></defs>'+[0,25,50,75,100].map(v=>'<line x1="32" x2="603" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-dasharray="3 4"/><text x="0" y="'+(y(v)+3)+'" font-size="9" fill="var(--muted)">'+v+'</text>').join('')+'<path d="'+line(actual)+' L596,136 L32,136Z" fill="url(#area)"/><path d="'+line(plan)+'" fill="none" stroke="#9aafb4" stroke-width="1.5" stroke-dasharray="5 5"/><path d="'+line(actual)+'" fill="none" stroke="#239679" stroke-width="2.5" stroke-linejoin="round"/><line x1="408" x2="408" y1="12" y2="141" stroke="var(--line)"/><circle cx="408" cy="'+y(a.progress)+'" r="4" fill="#239679" stroke="var(--surface)" stroke-width="2"/><text x="393" y="154" font-size="8" fill="var(--muted)">сегодня</text></svg></div><div class="chart-labels"><span>2 ноя</span><span>3 ноя</span><span>4 ноя</span><span>5 ноя</span><span>6 ноя</span><span>9 ноя</span><span>10 ноя</span></div><div class="chart-note">'+icon('info')+' Иллюстрация план/факт. История условная; факт на 6 ноября отражает текущие задачи.</div></section>';}
function workload(){return '<section class="card"><div class="between card-head"><h2>Загрузка команды</h2><span class="tiny muted">Активные задачи</span></div><div class="workload">'+S.people.map(p=>{const n=scoped().filter(t=>t.owner===p.id&&t.stage!=='done').length;const max=Math.max(1,...S.people.map(x=>scoped().filter(t=>t.owner===x.id&&t.stage!=='done').length));return '<button class="person-row" data-person="'+esc(p.id)+'" aria-label="Задачи: '+esc(p.name)+'">'+avatar(p.id)+'<span class="person-name">'+esc(p.name)+'</span><span class="bar person-bar"><span style="width:'+100*n/max+'%;background:'+(p.id==='anna'?'#a5aed9':p.id==='elena'?'#d8b8a2':p.id==='denis'?'#a1b7d1':'#99c8b8')+'"></span></span><span class="number mono">'+n+'</span></button>'}).join('')+'</div></section>';}
function taskRow(t){return '<tr><td><button class="task-name" data-task="'+esc(t.id)+'">'+(t.priority==='high'?'<span class="task-priority" title="Высокий приоритет">'+icon('flag')+'</span>':'')+esc(t.title)+'</button><div class="task-meta">'+esc(t.code)+' · '+esc(project(t.project)?.name)+'</div></td><td>'+badge(t)+'</td><td><span class="task-person">'+avatar(t.owner)+'<span>'+esc(person(t.owner).name.split(' ')[0])+'</span></span></td><td class="nowrap" style="color:'+(isLate(t)?'var(--red)':'var(--muted)')+'">'+(isLate(t)?'◷ ':'')+fmt(t.due)+'</td><td><span class="task-progress"><span class="bar"><span style="width:'+progress(t)+'%"></span></span><small>'+progress(t)+'%</small></span></td><td><button class="icon-button" data-task="'+esc(t.id)+'" aria-label="Открыть '+esc(t.title)+'">'+icon('chevron')+'</button></td></tr>';}
function tabs(){const tasks=scoped();return '<div class="tabs" role="group" aria-label="Статус задач">'+[['all','Все задачи',tasks.length],['active','Активные',tasks.filter(t=>t.stage!=='done').length],['review','Согласование',tasks.filter(t=>t.stage==='review').length],['late','Просрочены',tasks.filter(isLate).length],['done','Готово',tasks.filter(t=>t.stage==='done').length],['high','Приоритет',tasks.filter(t=>t.priority==='high'&&t.stage!=='done').length]].map(([id,label,n])=>'<button class="tab '+(U.filter===id?'active':'')+'" data-filter="'+id+'" aria-pressed="'+(U.filter===id)+'">'+label+'<span>'+n+'</span></button>').join('')+'</div>';}

function taskTable(){const tasks=filtered(),total=tasks.length,pages=Math.max(1,Math.ceil(total/SIZE));U.pageNum=Math.min(U.pageNum,pages);const shown=tasks.slice((U.pageNum-1)*SIZE,U.pageNum*SIZE);return '<section class="card" id="task-section"><div class="table-controls"><div class="between"><h2>'+(U.page==='overview'?'Задачи в фокусе':'Реестр задач')+'</h2>'+(U.page==='overview'?'<button class="button subtle" data-nav="tasks" style="min-height:24px;padding:0;font-size:10px">Все задачи '+icon('arrow')+'</button>':'<span class="tiny muted">'+tasks.length+' по текущим условиям</span>')+'</div>'+tabs()+'</div><div class="filters"><label class="search">'+icon('search')+'<input id="task-search" type="search" placeholder="Найти задачу, проект или сотрудника…" aria-label="Поиск задач" value="'+esc(U.q)+'"></label><select id="owner-filter" aria-label="Фильтр по сотруднику"><option value="">Вся команда</option>'+S.people.map(p=>'<option value="'+esc(p.id)+'" '+(p.id===U.owner?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select><select id="sort-filter" aria-label="Порядок задач">'+[['default','Порядок проекта'],['due','Ближайший срок'],['progress','По готовности']].map(([v,l])=>'<option value="'+v+'" '+(v===U.sort?'selected':'')+'>'+l+'</option>').join('')+'</select><span class="spacer"></span><div class="view-toggle"><button data-view="list" class="'+(U.view==='list'?'active':'')+'" aria-label="Показать список" aria-pressed="'+(U.view==='list')+'">'+icon('list')+'Список</button><button data-view="board" class="'+(U.view==='board'?'active':'')+'" aria-label="Показать доску" aria-pressed="'+(U.view==='board')+'">'+icon('board')+'Доска</button></div></div>'+(total?(U.view==='list'?'<div class="table-scroll"><table><thead><tr><th style="width:44%">Задача</th><th>Этап</th><th>Исполнитель</th><th>Срок</th><th>Готовность</th><th><span class="screenreader">Открыть</span></th></tr></thead><tbody>'+shown.map(taskRow).join('')+'</tbody></table></div>':'<div class="kanban">'+Object.entries(STAGES).map(([id,s])=>'<section class="lane"><div class="lane-title"><span class="dot" style="color:'+(id==='review'?'var(--amber)':'var(--green)')+'"></span>'+s.name+'<span class="spacer"></span><span class="tiny muted">'+tasks.filter(t=>t.stage===id).length+'</span></div>'+tasks.filter(t=>t.stage===id).map(t=>'<button class="lane-card" data-task="'+esc(t.id)+'"><span class="between"><span class="tiny muted">'+esc(t.code)+'</span>'+(t.priority==='high'?'<span class="task-priority">'+icon('flag')+'</span>':'')+'</span><h3>'+esc(t.title)+'</h3><span class="tiny muted">'+esc(project(t.project)?.name)+'</span><div class="bar"><span style="width:'+progress(t)+'%"></span></div><span class="between">'+avatar(t.owner)+'<span class="tiny" style="color:'+(isLate(t)?'var(--red)':'var(--muted)')+'">'+fmt(t.due)+'</span></span></button>').join('')+'</section>').join('')+'</div>'):empty())+'<div class="table-footer"><span>'+(total?(U.view==='list'?((U.pageNum-1)*SIZE+1)+'–'+Math.min(U.pageNum*SIZE,total)+' из '+total:'Всего '+total):'0 задач')+' · демонстрационные данные</span>'+(U.view==='list'?'<div class="pagination"><button data-paginate="'+(U.pageNum-1)+'" '+(U.pageNum===1?'disabled':'')+' aria-label="Предыдущая страница">‹</button>'+Array.from({length:pages},(_,i)=>'<button data-paginate="'+(i+1)+'" class="'+(U.pageNum===i+1?'active':'')+'" '+(U.pageNum===i+1?'aria-current="page"':'')+'>'+(i+1)+'</button>').join('')+'<button data-paginate="'+(U.pageNum+1)+'" '+(U.pageNum===pages?'disabled':'')+' aria-label="Следующая страница">›</button></div>':'')+'</div></section>';}
function overview(){return pageHeader('Обзор отдела','Задачи, люди и общий результат — в одном пространстве.')+scopeControls()+kpis()+'<div class="hero-grid">'+hero()+pipeline()+'</div><div class="analytics-grid">'+chart()+workload()+'</div>'+taskTable();}
function projectsPage(){return pageHeader('Комплексные задачи','От общей цели — к задачам команды и итоговому решению.')+'<div class="project-grid">'+S.projects.map(p=>{const tasks=S.tasks.filter(t=>t.project===p.id),a=aggregate(tasks);return '<section class="card project-card"><div class="between"><span class="badge '+(a.progress===100?'green':'blue')+'">'+(a.progress===100?'Завершён':'В работе')+'</span><span class="tiny muted">До '+fmt(p.due)+'</span></div><h2>'+esc(p.name)+'</h2><p>'+esc(p.goal)+'</p><div class="bar"><span style="width:'+a.progress+'%"></span></div><div class="between tiny muted" style="margin-top:8px"><span>'+a.done+' из '+a.total+' задач завершены</span><strong style="color:var(--green)">'+a.progress+'%</strong></div><div class="between"><div class="avatar-group">'+[...new Set(tasks.map(t=>t.owner))].map(avatar).join('')+'</div><button class="button" data-open-project="'+esc(p.id)+'">Открыть проект '+icon('arrow')+'</button></div></section>'}).join('')+'</div><div class="card card-body" style="margin-top:20px"><div class="between"><div><h2>Общий результат складывается из шагов</h2><p class="small muted" style="margin-top:7px">Готовность проекта — среднее выполнение задач. Закрытие зависит от контрольных шагов и предшественников.</p></div>'+icon('layers')+'</div></div>';}
function routePage(){const dates=['2026-11-02','2026-11-03','2026-11-04','2026-11-05','2026-11-06','2026-11-09','2026-11-10','2026-11-11','2026-11-12','2026-11-13'];const rows=scoped();return pageHeader('Маршрут и Гант','Параллельные ветви, сроки и зависимости. Учебный календарь: понедельник–пятница.')+scopeControls()+'<section class="card"><div class="card-head"><div class="gantt-key"><span><span class="dot" style="color:var(--green)"></span> Выполнение задачи</span><span><span class="dot" style="color:var(--amber)"></span> На согласовании</span><span>Полоса открывает карточку задачи</span></div></div><div class="gantt"><div class="gantt-grid"><div class="gantt-cell date" style="align-items:flex-start;padding-left:0">Задачи и зависимости</div>'+dates.map(d=>'<div class="gantt-cell date '+(d===TODAY?'today':'')+'">'+fmt(d)+'<span>'+(d===TODAY?'сегодня':'Пн Вт Ср Чт Пт'.split(' ')[new Date(d+'T12:00:00Z').getUTCDay()-1])+'</span></div>').join('')+rows.map((t,i)=>{const row=i+2;let start=dates.findIndex(d=>d>=t.start);if(start<0)start=9;let end=dates.findIndex(d=>d>=t.due);if(end<0)end=9;end=Math.max(start,end);return '<div class="gantt-cell" style="grid-row:'+row+';grid-column:1"><div><button class="task-name" data-task="'+esc(t.id)+'">'+esc(t.title)+'</button><div class="gantt-deps">'+esc(t.code)+(t.depends.length?' · после '+t.depends.map(id=>S.tasks.find(x=>x.id===id)?.code||id).join(', '):' · независимая задача')+'</div></div></div>'+dates.map((d,j)=>'<div class="gantt-cell grid '+(d===TODAY?'today':'')+'" style="grid-row:'+row+';grid-column:'+(j+2)+'"></div>').join('')+'<button class="gantt-bar '+t.stage+'" style="grid-row:'+row+';grid-column:'+(start+2)+' / '+(end+3)+'" data-task="'+esc(t.id)+'" aria-label="'+esc(t.title)+', '+progress(t)+' процентов"><span style="width:'+progress(t)+'%"></span><b class="gantt-bar-label">'+progress(t)+'%</b></button>'}).join('')+'</div></div><div class="chart-note">'+icon('info')+' Плановые интервалы заданы в карточках. Зависимости проверяются при завершении; праздничные дни не учитываются.</div></section>';}
function teamPage(){return pageHeader('Команда','Ответственные за задачи и распределение текущей работы.')+'<div class="team-grid">'+S.people.map(p=>{const tasks=S.tasks.filter(t=>t.owner===p.id),a=aggregate(tasks);return '<section class="card team-card">'+avatar(p.id)+'<h2>'+esc(p.name)+'</h2><p class="small muted">'+esc(p.role)+'</p><div class="bar"><span style="width:'+(a.total?a.done/a.total*100:0)+'%"></span></div><div class="between tiny muted"><span>'+a.done+' завершено</span><span>'+tasks.filter(t=>t.stage!=='done').length+' в работе</span></div><div class="between small" style="margin-top:18px"><span class="muted">Просрочено</span><span style="color:'+(a.late?'var(--red)':'var(--green)')+'">'+a.late+'</span></div><button class="button" data-person="'+esc(p.id)+'">Задачи сотрудника '+icon('arrow')+'</button></section>'}).join('')+'</div>';}
function footer(){return '<footer class="footer"><span>КОМПЛАЕНС / DEMO · Данные примера на 06.11.2026 · '+(storageOn?'Сохранение на устройстве включено':'Изменения хранятся до закрытия страницы')+'</span><button data-action="about">О проекте и прототипе</button></footer>';}
function render(){nav();document.getElementById('main').innerHTML=(U.page==='overview'?overview():U.page==='tasks'?pageHeader('Задачи отдела','Откройте карточку, проверьте контрольные шаги и передайте результат дальше.')+scopeControls()+(U.owner?'<div class="alert">'+icon('team')+'Показаны задачи: '+esc(person(U.owner).name)+'<button data-action="clear">Сбросить фильтры</button></div>':'')+taskTable():U.page==='projects'?projectsPage():U.page==='route'?routePage():teamPage())+footer();hydrate();}
function navigate(page,clear=true){U.page=page;U.pageNum=1;if(clear){U.filter='all';U.q='';U.owner='';U.project='';U.period='all';}document.getElementById('sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'instant'});}
function trapKey(e){const dialog=document.querySelector('[role="dialog"]');if(!dialog)return;if(e.key==='Escape'){closePortal();return;}if(e.key==='Tab'){const a=[...dialog.querySelectorAll('button,input,select,textarea,a[href]')].filter(n=>!n.disabled&&n.offsetParent!==null);if(!a.length)return;const first=a[0],last=a.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}
function openPortal(html,modal=false){if(!document.getElementById('portal').firstChild)focusBefore=document.activeElement;document.getElementById('portal').innerHTML='<div class="overlay '+(modal?'modal-overlay':'')+'" id="overlay">'+html+'</div>';document.body.style.overflow='hidden';document.querySelector('.app').inert=true;document.getElementById('sidebar').inert=true;hydrate();requestAnimationFrame(()=>document.querySelector('[role="dialog"] button')?.focus());}
function closePortal(){document.getElementById('portal').replaceChildren();document.body.style.overflow='';document.querySelector('.app').inert=false;document.getElementById('sidebar').inert=false;U.selected=null;focusBefore?.isConnected&&focusBefore.focus();}
function modal(title,content){openPortal('<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="between"><h2 id="modal-title">'+title+'</h2><button class="icon-button" data-action="close" aria-label="Закрыть">'+icon('close')+'</button></div>'+content+'</section>',true);}
function taskDrawer(id){const t=S.tasks.find(t=>t.id===id);if(!t)return;U.selected=id;const blocked=t.depends.map(id=>S.tasks.find(x=>x.id===id)).filter(x=>x&&x.stage!=='done');openPortal('<section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="drawer-header between"><div class="flex"><span class="tiny muted">'+esc(t.code)+'</span>'+badge(t)+'</div><button class="icon-button" data-action="close" aria-label="Закрыть карточку">'+icon('close')+'</button></div><div class="drawer-body"><div class="tiny muted">'+esc(project(t.project)?.name)+'</div><h2 id="drawer-title">'+esc(t.title)+'</h2><p class="small muted" style="line-height:1.8">'+esc(t.description)+'</p><form id="task-edit" data-id="'+esc(t.id)+'"><div class="drawer-grid"><label class="field">Исполнитель<select name="owner" aria-label="Исполнитель">'+S.people.map(p=>'<option value="'+esc(p.id)+'" '+(t.owner===p.id?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></label><label class="field">Приоритет<select name="priority" aria-label="Приоритет"><option value="normal" '+(t.priority==='normal'?'selected':'')+'>Обычный</option><option value="high" '+(t.priority==='high'?'selected':'')+'>Высокий</option></select></label><label class="field">Начало<input name="start" type="date" value="'+esc(t.start)+'" required></label><label class="field">Срок<input name="due" type="date" value="'+esc(t.due)+'" required></label><label class="field full">Этап<select name="stage" aria-label="Этап">'+Object.entries(STAGES).map(([id,s])=>'<option value="'+id+'" '+(t.stage===id?'selected':'')+'>'+s.name+'</option>').join('')+'</select></label></div><div class="error" id="edit-error" role="alert"></div><button type="submit" class="button">'+icon('check')+'Сохранить параметры</button></form><div class="drawer-section"><div class="between"><h3>Контрольные шаги</h3><span class="tiny muted">'+t.checks.filter(c=>c.done).length+' / '+t.checks.length+'</span></div><div class="bar" style="margin:15px 0"><span style="width:'+progress(t)+'%"></span></div>'+t.checks.map((c,i)=>'<label class="check-item '+(c.done?'checked':'')+'"><input type="checkbox" data-check="'+i+'" data-id="'+esc(id)+'" '+(c.done?'checked':'')+'><span>'+esc(c.text)+'</span></label>').join('')+(blocked.length?'<div class="alert" style="margin:15px 0 0;display:block">Сначала завершите: '+blocked.map(b=>'<button class="task-name" data-task="'+esc(b.id)+'" style="font-size:11px;color:inherit">'+esc(b.code)+' · '+esc(b.title)+'</button>').join(', ')+'</div>':'')+'<div class="drawer-actions">'+(t.stage!=='done'?'<button class="button primary" data-complete="'+esc(id)+'">'+icon('checkCircle')+'Завершить задачу</button>':'<span class="badge green">'+icon('check')+'Задача завершена</span>')+'</div><p class="tiny muted" style="margin-top:12px">Завершение доступно после выполнения шагов и предшествующих задач.</p></div><div class="drawer-section"><h3>Обсуждение</h3>'+t.comments.map(c=>'<div class="comment"><div class="comment-meta">'+avatar('leader')+'Марселлас Уоллес · '+esc(c.at)+'</div>'+esc(c.text)+'</div>').join('')+(t.comments.length?'':'<p class="small muted" style="margin-top:12px">Зафиксируйте уточнение или результат проверки.</p>')+'<form id="comment-form" class="comment-form" data-id="'+esc(id)+'"><label class="screenreader" for="comment-text">Комментарий</label><textarea id="comment-text" name="text" required maxlength="2000" placeholder="Добавить комментарий…"></textarea><button class="button" type="submit" aria-label="Добавить комментарий">'+icon('arrow')+'</button></form></div></div></section>');}
function newTask(){modal('Новая задача','<p>Добавьте задачу в комплексный проект и назначьте ответственного.</p><form id="new-task"><div class="drawer-grid"><label class="field full">Название задачи<input name="title" required maxlength="180" placeholder="Например, проверить комплект документов"></label><label class="field full">Проект<select name="project" aria-label="Проект">'+S.projects.map(p=>'<option value="'+esc(p.id)+'" '+(U.project===p.id?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></label><label class="field">Исполнитель<select name="owner" aria-label="Исполнитель">'+S.people.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('')+'</select></label><label class="field">Приоритет<select name="priority" aria-label="Приоритет"><option value="normal">Обычный</option><option value="high">Высокий</option></select></label><label class="field">Начало<input type="date" name="start" value="'+TODAY+'" required></label><label class="field">Срок<input type="date" name="due" value="2026-11-10" required></label><label class="field full">Контрольные шаги · по одному в строке<textarea name="checks" rows="3" required maxlength="3000" placeholder="Получить документы&#10;Проверить комплект&#10;Передать результат"></textarea></label><label class="field full">Описание<textarea name="description" maxlength="2000" rows="2" placeholder="Какой результат нужно получить"></textarea></label></div><div class="error" id="new-error" role="alert"></div><div class="drawer-actions"><button class="button primary" type="submit">Создать задачу</button><button class="button" type="button" data-action="close">Отмена</button></div></form>');requestAnimationFrame(()=>document.querySelector('[name="title"]')?.focus());}
function exportModal(){modal('Экспорт и сохранение','<p>CSV содержит задачи по текущим фильтрам. JSON сохраняет всё рабочее пространство, включая контрольные шаги и комментарии.</p><div class="stack" style="margin-top:20px;gap:10px"><button class="button" data-action="csv">'+icon('download')+'Скачать задачи · CSV ('+filtered().length+')</button><button class="button" data-action="json">'+icon('download')+'Сохранить рабочее пространство · JSON</button><label class="button" style="cursor:pointer">'+icon('layers')+'Открыть копию JSON<input type="file" accept=".json,application/json" id="import-file" class="screenreader"></label><label class="check-item" style="margin-top:8px"><input type="checkbox" id="remember" '+(storageOn?'checked':'')+'><span>Запоминать изменения в этом браузере</span></label><p class="tiny muted" style="margin-top:0">Для переноса на другой компьютер используйте JSON. Импорт заменяет данные после проверки; замену можно отменить.</p></div>');}
function download(name,type,text){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function about(){modal('О демоверсии','<p>Новый интерфейс вашего проекта «Комплаенс · Станок-качалка»: общая сводка, контроль задач, два комплексных проекта, команда и маршрут работ.</p><ul><li>В оформлении использованы принципы Tremor, Plausible и Geckoboard: спокойная сетка, ясные показатели и план/факт.</li><li>Карточки, контрольные шаги, комментарии, фильтры, доска, экспорт и локальное сохранение работают.</li><li>Станок-качалка — схематичная декоративная анимация. Процент готовности рассчитывается по задачам.</li><li>Учебные данные зафиксированы на 6 ноября 2026 года. График истории демонстрационный.</li><li>Демо не выполняет санкционный скрининг и не выдаёт юридических заключений. Совместная работа и сервер не подключены.</li></ul><p><a href="https://luxtendebant-ux.github.io/dashboard/" target="_blank" rel="noopener noreferrer">Исходный проект</a> · <a href="https://dashboard.tremor.so/overview" target="_blank" rel="noopener noreferrer">Tremor</a> · <a href="https://plausible.io/plausible.io" target="_blank" rel="noopener noreferrer">Plausible</a> · <a href="https://www.geckoboard.com/dashboard-examples/" target="_blank" rel="noopener noreferrer">Geckoboard</a></p><button class="button primary" data-action="close" style="margin-top:20px">Попробовать демо</button>');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(e.target.id==='overlay'){closePortal();return;}if(!b)return;
if(b.dataset.nav){navigate(b.dataset.nav);return;}
if(b.dataset.task){taskDrawer(b.dataset.task);return;}
if(b.dataset.filter){U.filter=b.dataset.filter;U.pageNum=1;render();return;}
if(b.dataset.kpi){U.page='tasks';U.filter=b.dataset.kpi;U.q='';U.pageNum=1;render();window.scrollTo({top:0,behavior:'smooth'});return;}
if(b.dataset.person){closePortal();navigate('tasks');U.owner=b.dataset.person;render();return;}
if(b.dataset.openProject){closePortal();navigate('tasks');U.project=b.dataset.openProject;render();return;}
if(b.dataset.view){U.view=b.dataset.view;U.pageNum=1;render();return;}
if(b.dataset.paginate){U.pageNum=Number(b.dataset.paginate);render();return;}
if(b.dataset.complete){const t=S.tasks.find(t=>t.id===b.dataset.complete);if(t.checks.some(c=>!c.done)){toast('Сначала выполните все контрольные шаги.');return;}if(t.depends.some(id=>S.tasks.find(p=>p.id===id)?.stage!=='done')){toast('Сначала завершите предшествующие задачи.');return;}const id=t.id;change(()=>t.stage='done','Задача завершена. Готовность пересчитана.');taskDrawer(id);return;}
const a=b.dataset.action;if(a==='new')newTask();else if(a==='close')closePortal();else if(a==='about')about();else if(a==='export')exportModal();else if(a==='theme'){document.body.classList.toggle('dark');try{localStorage.setItem(KEY+'-theme',document.body.classList.contains('dark')?'dark':'light')}catch{}nav();}else if(a==='pump'){U.pumpPaused=!U.pumpPaused;render();}else if(a==='menu'){document.getElementById('sidebar').classList.toggle('open');}else if(a==='search'){navigate('tasks');document.getElementById('task-search').focus();}else if(a==='clear'){U.filter='all';U.q='';U.owner='';U.project='';U.period='all';U.pageNum=1;render();}else if(a==='undo'){if(undoState){S=undoState;undoState=null;save();closePortal();render();toast('Последнее изменение отменено.')}}else if(a==='reset'){modal('Начать демо заново?','<p>Вернём исходные 13 задач и два проекта. Последние изменения можно предварительно сохранить в JSON.</p><div class="drawer-actions"><button class="button primary" data-action="reset-confirm">Восстановить демо</button><button class="button" data-action="close">Отмена</button></div>');}else if(a==='reset-confirm'){closePortal();change(()=>{S=seed();U={...U,page:'overview',filter:'all',q:'',owner:'',project:'',period:'all',pageNum:1}},'Исходное демо восстановлено.');}else if(a==='json'){download('compliance-workspace.json','application/json;charset=utf-8',JSON.stringify(S,null,2));toast('JSON-копия подготовлена.');}else if(a==='csv'){const cell=v=>'"'+String(v??'').replace(/^[=+\-@\t\r]/,"'$&").replace(/"/g,'""')+'"';const rows=[['Код','Задача','Проект','Этап','Исполнитель','Начало','Срок','Готовность, %','Приоритет'],...filtered().map(t=>[t.code,t.title,project(t.project)?.name,STAGES[t.stage].name,person(t.owner).name,t.start,t.due,progress(t),t.priority==='high'?'Высокий':'Обычный'])];download('compliance-tasks.csv','text/csv;charset=utf-8','\uFEFF'+rows.map(r=>r.map(cell).join(';')).join('\r\n'));toast('CSV подготовлен по текущим фильтрам.');}
});
document.addEventListener('input',e=>{if(e.target.id==='task-search'){const n=e.target,at=n.selectionStart;U.q=n.value;U.pageNum=1;render();const next=document.getElementById('task-search');next.focus();try{next.setSelectionRange(at,at)}catch{}}});
document.addEventListener('change',async e=>{const n=e.target;if(n.id==='owner-filter'||n.id==='project-filter'||n.id==='period-filter'||n.id==='sort-filter'){U[{ 'owner-filter':'owner','project-filter':'project','period-filter':'period','sort-filter':'sort'}[n.id]]=n.value;U.pageNum=1;render();}else if(n.dataset.check!==undefined){const t=S.tasks.find(t=>t.id===n.dataset.id),checked=n.checked,i=Number(n.dataset.check);if(t.stage==='done'&&!checked&&S.tasks.some(x=>x.stage==='done'&&x.depends.includes(t.id))){n.checked=true;toast('Сначала верните зависимую завершённую задачу в работу.');return;}change(()=>{t.checks[i].done=checked;if(t.stage==='done'&&!checked)t.stage='work'},'Контрольный шаг обновлён.');taskDrawer(t.id);document.querySelector('[data-check="'+i+'"]')?.focus();}else if(n.id==='remember'){storageOn=n.checked;try{localStorage.setItem(KEY+'-remember',storageOn?'yes':'no');if(!storageOn)localStorage.removeItem(KEY);save();toast(storageOn?'Сохранение в браузере включено.':'Сохранение в браузере выключено.');render();}catch{storageOn=false;n.checked=false;toast('Браузер не разрешил локальное сохранение.');}}else if(n.id==='import-file'){const file=n.files?.[0];if(!file)return;try{if(file.size>2e6)throw Error('Файл слишком большой. Максимум 2 МБ.');const parsed=JSON.parse(await file.text());if(!validState(parsed))throw Error('Формат копии не подходит для этой демоверсии.');const ids=parsed.tasks.map(t=>t.id);if(new Set(ids).size!==ids.length)throw Error('В копии есть повторяющиеся задачи.');closePortal();change(()=>{S=parsed;U.project='';U.owner='';U.filter='all';U.q='';U.pageNum=1},'Рабочее пространство восстановлено из копии.');}catch(err){toast(err.message||'Не удалось прочитать JSON.');n.value='';}}});

const V2={version:'2.0',actor:'leader',demo:null,pumpRunning:false,speed:1,lastFrame:0,angle:0,cycles:0,raf:0,visual:new Map(),sequenceTimer:0};
const uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const isoNow=()=>new Date().toISOString();
const HERO_NAMES={anna:'Винсент Вега',mikhail:'Джулс Уиннфилд',elena:'Мия Уоллес',denis:'Бутч Кулидж',leader:'Марселлас Уоллес'};
const baseSeed=seed,baseRender=render,baseNav=nav,baseDrawer=taskDrawer,baseNew=newTask,baseValid=validState,baseFooter=footer;
const validDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isFinite(Date.parse(d+'T12:00:00Z'))&&new Date(d+'T12:00:00Z').toISOString().slice(0,10)===d;
function normalizeV2(state){state.activity=Array.isArray(state.activity)?state.activity:[];state.people.forEach(p=>{if(HERO_NAMES[p.id])p.name=HERO_NAMES[p.id]});state.tasks.forEach(t=>{t.result=typeof t.result==='string'?t.result:'';t.createdAt=t.createdAt||'2026-11-02T01:00:00.000Z';t.updatedAt=t.updatedAt||t.createdAt;t.completedAt=t.completedAt||(t.stage==='done'?t.updatedAt:null);if(t.stage==='review'||t.stage==='done'){t.checks.forEach(c=>c.done=true);if(!t.result)t.result='Комплект материалов подготовлен в исходном учебном примере.';}});return state;}
seed=()=>normalizeV2(baseSeed());S=normalizeV2(S);
validState=function(x){try{if(!baseValid(x)||!x.people.length||!x.projects.length)return false;for(const key of ['people','projects','tasks'])if(new Set(x[key].map(i=>i.id)).size!==x[key].length)return false;
const map=new Map(x.tasks.map(t=>[t.id,t]));const visiting=new Set(),done=new Set();function visit(t){if(visiting.has(t.id))throw Error('Цикл зависимостей');if(done.has(t.id))return;visiting.add(t.id);for(const id of t.depends){if(id===t.id||!map.has(id)||map.get(id).project!==t.project)throw Error('Зависимость');visit(map.get(id));}visiting.delete(t.id);done.add(t.id);}
for(const p of x.projects)if(!validDate(p.due)||!p.name.trim())return false;
for(const t of x.tasks){if(!validDate(t.start)||!validDate(t.due)||t.due<t.start||!t.title.trim()||!t.checks.length||t.checks.length>30||new Set(t.depends).size!==t.depends.length)return false;visit(t);if(t.stage!=='inbox'&&t.depends.some(id=>map.get(id).stage!=='done'))return false;if(['review','done'].includes(t.stage)&&(t.checks.some(c=>!c.done)||!String(t.result||'').trim()))return false;}
return !x.activity||Array.isArray(x.activity)&&x.activity.length<=2000&&x.activity.every(a=>typeof a.id==='string'&&typeof a.text==='string'&&typeof a.at==='string');}catch{return false;}};

change=function(fn,message){const before=structuredClone(S);try{fn();if(!validState(S))throw Error('Изменение нарушает маршрут или структуру задач.');undoState=before;const t=isoNow();S.activity.unshift({id:uid(),at:t,actor:V2.actor,text:message||'Рабочее пространство обновлено',taskId:V2.commandTask||null,stats:snapshotStats()});S.activity=S.activity.slice(0,1000);save();render();if(message&&!V2.demo?.playing)toast(message,true);return true;}catch(err){S=before;throw err;}finally{V2.commandTask=null;}};

function createTaskRecord(d){checkTaskFields(d);const id=uid();command('Создана задача «'+d.title.trim()+'»',id,()=>{const max=Math.max(0,...S.tasks.map(t=>Number(t.code.match(/\d+$/)?.[0])||0));S.tasks.push({id,code:'СК-'+String(max+1).padStart(3,'0'),title:d.title.trim(),description:String(d.description||'').trim(),result:'',owner:d.owner,project:d.project,priority:d.priority==='high'?'high':'normal',stage:'inbox',start:d.start,due:d.due,depends:d.depends||[],checks:d.checks.map(c=>({text:c.text.trim(),done:false})),comments:[],createdAt:isoNow(),updatedAt:isoNow(),completedAt:null});});return id;}

function setCheck(id,index,done){const t=requireTask(id);if(t.stage!=='work')throw Error('Контрольные шаги отмечаются на этапе «В работе».');if(!t.checks[index])throw Error('Контрольный шаг не найден.');command((done?'Выполнен':'Возвращён')+' шаг: '+t.checks[index].text,id,()=>{t.checks[index].done=done;t.updatedAt=isoNow();});}

function createProjectRecord(d){if(!d.name.trim()||!validDate(d.due))throw Error('Укажите название и корректный срок проекта.');const id=uid();command('Создан проект «'+d.name.trim()+'»',null,()=>S.projects.push({id,name:d.name.trim(),goal:d.goal.trim(),due:d.due,owner:V2.actor}));return id;}

function taskFormFields(t=null){const p=t?.project||U.project||S.projects[0].id;return '<div class="drawer-grid"><label class="field full">Название задачи<input name="title" value="'+esc(t?.title||'')+'" maxlength="180" required></label><label class="field full">Проект<select name="project" aria-label="Проект" '+(t?'disabled':'')+'>'+S.projects.map(x=>'<option value="'+esc(x.id)+'" '+(p===x.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>'+(t?'':'<button class="new-project-link" type="button" data-action="new-project">+ Создать комплексную задачу</button>')+'</label><label class="field">Исполнитель<select name="owner" aria-label="Исполнитель">'+S.people.map(x=>'<option value="'+x.id+'" '+((t?.owner||V2.actor)===x.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></label><label class="field">Приоритет<select name="priority" aria-label="Приоритет"><option value="normal">Обычный</option><option value="high" '+(t?.priority==='high'?'selected':'')+'>Высокий</option></select></label><label class="field">Начало<input type="date" name="start" value="'+(t?.start||TODAY)+'" required></label><label class="field">Срок<input type="date" name="due" value="'+(t?.due||'2026-11-13')+'" required></label><label class="field full">Описание<textarea name="description" rows="3" maxlength="3000">'+esc(t?.description||'')+'</textarea></label>'+(t?'<label class="field full">Результат и основания<textarea name="result" rows="3" maxlength="3000" placeholder="Что сделано, где сохранён результат, какие вопросы решены">'+esc(t.result)+'</textarea></label><label class="field full">Этап<select name="stage" aria-label="Этап">'+Object.entries(STAGES).map(([id,s])=>'<option value="'+id+'" '+(t.stage===id?'selected':'')+'>'+s.name+'</option>').join('')+'</select></label>':'<label class="field full">Контрольные шаги · по одному в строке<textarea name="checks" rows="3" required placeholder="Получить документы&#10;Проверить комплект&#10;Подготовить результат"></textarea> function startAnimation(){if(V2.raf)return;V2.lastFrame=0;function tick(time){const dt=V2.lastFrame?Math.min(.05,(time-V2.lastFrame)/1000):.016;V2.lastFrame=time;const a=assemblyReadiness(),assembled=[...document.querySelectorAll('[data-scene]')].every(root=>[0,1,2,3,4].every(i=>(V2.visual.get(root.dataset.scene+':'+i)||0)>.995));const running=V2.pumpRunning&&a.all&&assembled;if(running){const before=Math.floor(V2.angle/(2*Math.PI));V2.angle+=dt*2*Math.PI/5*V2.speed;V2.cycles+=Math.floor(V2.angle/(2*Math.PI))-before;}document.querySelectorAll('[data-scene]').forEach(root=>drawScene(root,dt,running));document.querySelectorAll('[data-pump-status]').forEach(n=>n.textContent=!a.all?'Ожидает завершения задач':!assembled?'Соединение узлов':running?'Качалка работает':'Готов к пуску');document.querySelectorAll('[data-cycles]').forEach(n=>n.textContent=V2.cycles);document.querySelectorAll('[data-phase]').forEach(n=>n.textContent=Math.round(V2.angle*180/Math.PI%360)+'°');document.querySelectorAll('[data-flow-status]').forEach(n=>n.textContent=running?'идёт':'остановлен');V2.raf=requestAnimationFrame(tick);}V2.raf=requestAnimationFrame(tick);}

function restoreDraft(d){const f=document.getElementById('v2-edit');if(!f||!d)return;for(const [key,value] of Object.entries(d.fields)){if(key==='depends')continue;const n=f.elements.namedItem(key);if(n)n.value=value;}f.querySelectorAll('[name="depends"]').forEach(n=>n.checked=d.depends.includes(n.value));}
// Capture enhanced operations before the original demo handlers.
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;if(b.dataset.approve){e.stopImmediatePropagation();try{updateTaskRecord(b.dataset.approve,{stage:'done'});taskDrawer(b.dataset.approve)}catch(err){toast(err.message)}return;}if(!['assembly','new-project','motor','assembly-replay','demo-start','demo-toggle','demo-next','demo-exit','demo-log','about-v2','about','reset-confirm'].includes(a))return;e.stopImmediatePropagation();try{if(a==='assembly'){closePortal();U.page='assembly';U.owner='';U.q='';render();window.scrollTo({top:0,behavior:'instant'});}else if(a==='new-project')newProject();else if(a==='motor'){if(!assemblyReadiness().all)throw Error('Завершите все задачи проекта.');V2.pumpRunning=!V2.pumpRunning;}else if(a==='assembly-replay'){V2.visual.clear();V2.angle=0;V2.cycles=0;}else if(a==='demo-start')startDemo();else if(a==='demo-toggle'){if(V2.demo.index>=V2.demo.steps.length){exitDemo();startDemo();}else{V2.demo.playing=!V2.demo.playing;scheduleDemo();render();}}else if(a==='demo-next'){V2.demo.playing=false;clearTimeout(V2.sequenceTimer);nextDemo();}else if(a==='demo-exit')exitDemo();else if(a==='demo-log')download('demo-test-protocol.json','application/json',JSON.stringify({version:V2.version,started:V2.demo.started,completed:V2.demo.index===V2.demo.steps.length,steps:V2.demo.logs},null,2));else if(a==='reset-confirm'){if(V2.demo)exitDemo();closePortal();change(()=>{S=seed();U.project='';U.owner='';U.filter='all';U.q='';U.page='overview';V2.pumpRunning=false;V2.visual.clear();},'Восстановлено исходное рабочее пространство');}else modal('Комплаенс · Сборка результата 2.0','<p>Рабочий цикл: создание → заполнение → работа → контрольные шаги → результат → согласование → завершение. Журнал и история отражают фактические действия.</p><p>Качалка собирается из пяти узлов. Кривошип, шатун и балансир связаны расчётом четырёхзвенного механизма. Условный поток показывает работу; это не модель реальной добычи.</p><p>Сценарий демонстрации изолирован и использует те же команды. «Протокол» выгружает результаты всех шагов.</p><p>Данные учебные; реальный санкционный скрининг, сервер и совместное редактирование не подключены. Подпись автора не является аутентификацией.</p><button class="button primary" data-action="close" style="margin-top:15px">Закрыть</button>');}catch(err){toast(err.message)}},true);
document.addEventListener('submit',e=>{const form=e.target;if(!['v2-create','v2-edit','v2-comment','v2-project'].includes(form.id))return;e.preventDefault();e.stopImmediatePropagation();const fd=new FormData(form),d=Object.fromEntries(fd);try{if(form.id==='v2-create'){const id=createTaskRecord({...d,checks:d.checks.split('\n').map(s=>s.trim()).filter(Boolean).map(text=>({text})),depends:fd.getAll('depends')});U.q='';U.filter='all';U.owner='';U.project=d.project;U.page='tasks';closePortal();render();taskDrawer(id);}else if(form.id==='v2-edit'){const id=form.dataset.id;updateTaskRecord(id,{...d,project:requireTask(id).project,depends:fd.getAll('depends')});taskDrawer(id);}else if(form.id==='v2-comment'){const draft=captureDraft();addComment(form.dataset.id,d.text);taskDrawer(form.dataset.id);restoreDraft(draft);}else{const id=createProjectRecord(d);closePortal();U.project=id;U.page='projects';render();toast('Проект создан. Добавьте задачи.');}}catch(err){const n=form.querySelector('.error');if(n)n.textContent=err.message;else toast(err.message);}},true);
document.addEventListener('change',e=>{const n=e.target;if(n.dataset.v2Check!==undefined){e.stopImmediatePropagation();try{const id=n.dataset.taskId,draft=captureDraft();setCheck(id,Number(n.dataset.v2Check),n.checked);taskDrawer(id);restoreDraft(draft);document.querySelector('[data-v2-check="'+n.dataset.v2Check+'"]')?.focus()}catch(err){n.checked=!n.checked;toast(err.message)}return;}if(n.id==='actor-select'){e.stopImmediatePropagation();V2.actor=n.value;render();}else if(n.id==='motor-speed'){V2.speed=Number(n.value)}else if(n.id==='demo-speed'){V2.demo.speed=Number(n.value);scheduleDemo()}else if(n.name==='project'&&n.closest('#v2-create')){n.closest('form').querySelector('.dependency-list').innerHTML=dependenciesMarkup(n.value,null);}else if(n.id==='import-file'){e.stopImmediatePropagation();const file=n.files?.[0];if(!file)return;(async()=>{try{if(file.size>2e6)throw Error('Максимальный размер копии — 2 МБ.');const parsed=JSON.parse(await file.text());if(!validState(parsed))throw Error('Копия не прошла проверку данных, дат или зависимостей.');closePortal();change(()=>{S=parsed;S.activity=S.activity||[];U.project='';U.owner='';U.q='';U.filter='all';},'Импортирована копия рабочего пространства');}catch(err){toast(err.message)}})();}},true);
document.addEventListener('dragstart',e=>{const card=e.target.closest('.lane-card');if(!card)return;e.dataTransfer.setData('text/plain',card.dataset.task);e.dataTransfer.effectAllowed='move';});
document.addEventListener('dragover',e=>{const lane=e.target.closest('.lane');if(lane){e.preventDefault();e.dataTransfer.dropEffect='move';}});
document.addEventListener('drop',e=>{const lane=e.target.closest('.lane');if(!lane)return;e.preventDefault();try{updateTaskRecord(e.dataTransfer.getData('text/plain'),{stage:lane.dataset.lane})}catch(err){toast(err.message)}});
save();render();

</script>
